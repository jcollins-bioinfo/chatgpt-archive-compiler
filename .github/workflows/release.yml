name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install frozen release environment
        run: |
          python -m pip install "uv==0.11.28"
          uv lock --check
          uv sync --frozen --extra dev --extra semantic

      - name: Verify tag matches package version
        run: |
          test "v$(uv run python -c 'from chatgpt_archive_compiler import __version__; print(__version__)')" = "${GITHUB_REF_NAME}"

      - name: Run release checks
        run: |
          uv run pytest
          uv build
          uv run twine check dist/*
          sha256sum dist/* > dist/SHA256SUMS

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --generate-notes \
            --prerelease \
            --title "${GITHUB_REF_NAME}"
