[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "chatgpt-archive-compiler"
dynamic = ["version"]
description = "Private interactive knowledge atlas and loss-aware compiler for ChatGPT data exports."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "John Collins" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["chatgpt", "data-export", "archive", "semantic-analysis", "pdf", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "markdown-it-py>=3.0",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
app = [
  "dash>=2.17",
]
dev = [
  "black[jupyter]>=24.4",
  "build>=1.2",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=5.1",
  "types-beautifulsoup4>=4.12",
]
notebooks = [
  "ipykernel>=6.29",
  "jupyter>=1.0",
]
pdf = [
  "weasyprint>=62.0",
]
semantic = [
  "numpy>=1.26,<2.3",
  "openai>=1.66",
  "polars>=1.0",
  "scikit-learn>=1.4",
  "tiktoken>=0.8",
]

[project.urls]
Homepage = "https://github.com/jcollins-bioinfo/chatgpt-archive-compiler"
Repository = "https://github.com/jcollins-bioinfo/chatgpt-archive-compiler"
Issues = "https://github.com/jcollins-bioinfo/chatgpt-archive-compiler/issues"
Changelog = "https://github.com/jcollins-bioinfo/chatgpt-archive-compiler/blob/main/CHANGELOG.md"

[project.scripts]
chatgpt-archive = "chatgpt_archive_compiler.cli:app"

[tool.hatch.version]
path = "src/chatgpt_archive_compiler/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_archive_compiler"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chatgpt_archive_compiler"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
