[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chatgpt-archive-compiler"
version = "0.1.0a1"
description = "Local-first compiler for ChatGPT data exports into analyzed, redacted, book-quality archives."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "John Collins" }]
license = { text = "License TBD before public release" }
keywords = ["chatgpt", "data-export", "archive", "dash", "pdf", "privacy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "dash>=2.17",
  "dash-ag-grid>=31.0",
  "dash-mantine-components>=0.14",
  "duckdb>=1.0",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "orjson>=3.10",
  "plotly>=5.22",
  "polars>=1.0",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "black[jupyter]>=24.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-beautifulsoup4>=4.12",
]
notebooks = [
  "ipykernel>=6.29",
  "jupyter>=1.0",
]
pdf = [
  "weasyprint>=62.0",
]

[project.scripts]
chatgpt-archive = "chatgpt_archive_compiler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_archive_compiler"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chatgpt_archive_compiler"]
